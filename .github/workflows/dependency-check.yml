name: OWASP Dependency Check

on:
  schedule:
    - cron: '0 5 * * 1'   # Every Monday at 05:00 UTC
  workflow_dispatch:

jobs:
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify NVD_API_KEY is configured
        run: |
          if [ -z "${{ secrets.NVD_API_KEY }}" ]; then
            echo "::error::NVD_API_KEY secret is not set — the scan silently exits without running instead of failing loudly if this isn't caught here. Add it under Settings > Secrets and variables > Actions (free key: https://nvd.nist.gov/developers/request-an-api-key)."
            exit 1
          fi

      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: owasp-nvd-${{ github.run_id }}
          restore-keys: owasp-nvd-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'ChatApp'
          path: '.'
          format: 'HTML'
          args: >
            --failOnCVSS 7
            --enableExperimental
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
        # Tolerates a genuine CVSS>=7 finding failing this specific step (the report is still
        # uploaded below either way) — misconfiguration (missing key) is now caught by the
        # verification step above, before it can reach here and be masked by this.
        continue-on-error: true

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: ${{ github.workspace }}/reports/
