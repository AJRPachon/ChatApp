# Sign in / Sign up tabs switch the form (confirm-password field only in sign up), the
# switch-mode links do the same, and the eye icon toggles password visibility.
appId: com.ajrpachon.chatapp
name: "02 · Pestañas login/registro y mostrar contraseña"
tags:
  - auth
---
- runFlow: ../../subflows/launch_clean.yaml
- assertNotVisible:
    id: auth_confirm_password_field
- tapOn:
    id: auth_tab_sign_up
- assertVisible:
    id: auth_confirm_password_field
- tapOn:
    id: auth_tab_sign_in
- assertNotVisible:
    id: auth_confirm_password_field
# Bottom links
- tapOn:
    id: auth_switch_to_sign_up_link
- assertVisible:
    id: auth_confirm_password_field
- tapOn:
    id: auth_switch_to_sign_in_link
- assertNotVisible:
    id: auth_confirm_password_field
# Password visibility: typed text becomes readable after tapping the eye
- tapOn:
    id: auth_password_field
- inputText: "Visible${RUN_ID}"
- assertNotVisible:
    text: "Visible${RUN_ID}"
- tapOn:
    id: auth_password_visibility_toggle
- assertVisible:
    text: "Visible${RUN_ID}"
