# Sign out from Profile returns to auth; signing in again works.
appId: com.ajrpachon.chatapp
name: "02 · Logout y login de nuevo"
tags:
  - auth
---
- runFlow: ../../subflows/ensure_logged_in.yaml
- runFlow: ../../subflows/logout.yaml
- tapOn:
    id: auth_email_field
- inputText: ${QA_EMAIL}
- hideKeyboard
- tapOn:
    id: auth_password_field
- inputText: ${QA_PASSWORD}
- hideKeyboard
- tapOn:
    id: auth_submit_button
- runFlow: ../../subflows/decline_save_password.yaml
- extendedWaitUntil:
    visible:
      id: conversation_list_new_chat_fab
    timeout: 45000
