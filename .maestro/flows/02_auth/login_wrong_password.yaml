# Wrong password shows an error and stays on the auth screen.
appId: com.ajrpachon.chatapp
name: "02 · Contraseña incorrecta muestra error"
tags:
  - auth
---
- runFlow: ../../subflows/launch_clean.yaml
- tapOn:
    id: auth_email_field
- inputText: ${QA_EMAIL}
- hideKeyboard
- tapOn:
    id: auth_password_field
- inputText: "wrong-password-${RUN_ID}"
- hideKeyboard
- tapOn:
    id: auth_submit_button
- extendedWaitUntil:
    visible:
      id: auth_snackbar
    timeout: 20000
- assertVisible:
    id: auth_email_field
- assertNotVisible:
    id: conversation_list_new_chat_fab
