# The submit button is disabled until both email and password are filled in.
appId: com.ajrpachon.chatapp
name: "02 · Botón deshabilitado con campos vacíos"
tags:
  - auth
---
- runFlow: ../../subflows/launch_clean.yaml
- assertVisible:
    id: auth_submit_button
    enabled: false
- tapOn:
    id: auth_email_field
- inputText: ${QA_EMAIL}
- hideKeyboard
- assertVisible:
    id: auth_submit_button
    enabled: false
- tapOn:
    id: auth_password_field
- inputText: "x"
- hideKeyboard
- assertVisible:
    id: auth_submit_button
    enabled: true
