appId: com.ajrpachon.chatapp
---
# Email/password sign-in against the persistent QA account.
# Run with:
#   maestro test .maestro/flows/login_email.yaml -e QA_EMAIL=... -e QA_PASSWORD=...
# or see .maestro/README.md for the .env-based shortcut.
- runFlow:
    file: ../subflows/login_qa.yaml
    env:
      LOGIN_EMAIL: ${QA_EMAIL}
      LOGIN_PASSWORD: ${QA_PASSWORD}
