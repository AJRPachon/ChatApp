appId: com.ajrpachon.chatapp
---
# Signs in as the QA account, then signs out again, verifying we land
# back on the auth screen. Exercises both reusable subflows together and
# leaves the app logged out, matching how it started.
# Run with:
#   maestro test .maestro/flows/login_logout_roundtrip.yaml -e QA_EMAIL=... -e QA_PASSWORD=...
- runFlow:
    file: ../subflows/login_qa.yaml
    env:
      LOGIN_EMAIL: ${QA_EMAIL}
      LOGIN_PASSWORD: ${QA_PASSWORD}
- runFlow: ../subflows/logout.yaml
