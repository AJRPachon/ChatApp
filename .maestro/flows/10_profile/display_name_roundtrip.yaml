# Profile: change the display name (saved on IME Done), check it persists after reopening, restore it.
appId: com.ajrpachon.chatapp
name: "10 · Nombre visible ida y vuelta"
tags:
  - profile
  - emulator-only   # needs Gboard suggestions off (Enter could commit a suggestion as the name)
# Even with suggestions off Gboard completes a learned word on Enter ("claudeqa" was saved as
# "claudeqa2"/"claudeqa3"): typing a space commits the word as typed, Backspace removes the space.
---
- runFlow: ../../subflows/login.yaml
- tapOn:
    id: conversation_list_profile_button
# Tap the right edge so the cursor lands at the end of the existing text before erasing.
- tapOn:
    id: profile_display_name_field
    point: "95%,50%"
- eraseText: 60
- inputText: "qaname${RUN_ID} "
- pressKey: Backspace
- pressKey: Enter
- back
- tapOn:
    id: conversation_list_profile_button
- assertVisible:
    text: "qaname${RUN_ID}"
# Tap the right edge so the cursor lands at the end of the existing text before erasing.
- tapOn:
    id: profile_display_name_field
    point: "95%,50%"
- eraseText: 60
- inputText: "${QA_NAME} "
- pressKey: Backspace
- pressKey: Enter
- back
- tapOn:
    id: conversation_list_profile_button
- assertVisible:
    text: ${QA_NAME}
