# Profile: change the display name (saved on IME Done), check it persists after reopening, restore it.
appId: com.ajrpachon.chatapp
name: "10 · Nombre visible ida y vuelta"
tags:
  - profile
  - emulator-only   # needs Gboard suggestions off (Enter could commit a suggestion as the name)
# The name is pasted, not typed: Gboard completes a typed "claudeqa" to the learned "claudeqa2"/"claudeqa3"
# on Enter even with autocorrect off, while pasted text has no composing word to complete.
---
- runFlow: ../../subflows/ensure_logged_in.yaml
- tapOn:
    id: conversation_list_profile_button
# Tap the right edge so the cursor lands at the end of the existing text before erasing.
- tapOn:
    id: profile_display_name_field
    point: "95%,50%"
- eraseText: 60
- setClipboard: "qaname${RUN_ID}"
- pasteText
- pressKey: Enter
- back
- tapOn:
    id: conversation_list_profile_button
- assertVisible:
    text: "qaname${RUN_ID}"
# Tap the right edge so the cursor lands at the end of the existing text before erasing.
- tapOn:
    id: profile_display_name_field
    point: "95%,50%"
- eraseText: 60
- setClipboard: ${QA_NAME}
- pasteText
- pressKey: Enter
- back
- tapOn:
    id: conversation_list_profile_button
- assertVisible:
    text: ${QA_NAME}
