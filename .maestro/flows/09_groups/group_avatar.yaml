# Group info (admin): tapping the avatar opens the photo picker; the picked image is uploaded and
# the "photo updated" message shows. Picks the newest photo: with -AllowPersonalData the fixture
# image is pushed first.
appId: com.ajrpachon.chatapp
name: "09 · Cambiar la foto del grupo"
tags:
  - groups
  - personal-data   # system photo picker
---
- runFlow: ../../subflows/ensure_logged_in.yaml
- runFlow:
    file: ../../subflows/open_conversation.yaml
    env:
      CONTACT: ${QA_GROUP}
- tapOn:
    id: chat_top_bar_menu_button
- tapOn:
    id: chat_menu_group_info
- tapOn:
    id: group_info_avatar
# Single pick (GetContent): the picker returns on the first tap. Not pick_first_media: its
# multi-select "Done" check takes ~7 s to rule out, longer than the 4 s snackbar on a fast upload.
- extendedWaitUntil:
    visible:
      text: "(Foto|Photo) .*"
    timeout: 15000
- tapOn:
    text: "(Foto|Photo) .*"
    index: 0
- extendedWaitUntil:
    visible:
      id: group_info_snackbar
    timeout: 45000
- assertVisible:
    id: group_info_avatar
- back
