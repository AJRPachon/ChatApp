# Long-press a conversation > Delete removes it from the list (on a group created by this run).
appId: com.ajrpachon.chatapp
name: "03 · Borrar conversación desde la lista"
tags:
  - conversations
---
- runFlow: ../../subflows/ensure_logged_in.yaml
- runFlow:
    file: ../../subflows/create_group.yaml
    env:
      MEMBER: ${QA2_USERNAME}
      GROUP_NAME: "del${RUN_ID}"
- tapOn:
    id: chat_back_button
- extendedWaitUntil:
    visible:
      id: "conversation_row_del${RUN_ID}"
    timeout: 15000
- runFlow:
    file: ../../subflows/open_conversation_menu.yaml
    env:
      CONTACT: "del${RUN_ID}"
      ITEM: conversation_menu_delete
- runFlow:
    when:
      visible:
        id: delete_confirm
    commands:
      - tapOn:
          id: delete_confirm
- extendedWaitUntil:
    notVisible:
      id: "conversation_row_del${RUN_ID}"
    timeout: 15000
