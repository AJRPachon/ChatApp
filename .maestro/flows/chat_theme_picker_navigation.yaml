appId: com.ajrpachon.chatapp
---
# Signs in, opens the conversation with @claudeqa2, opens "Chat theme"
# from the overflow menu, confirms the theme options render, then
# dismisses the sheet via the back button without picking anything (so
# no chat theme actually changes).
# Run with:
#   maestro test .maestro/flows/chat_theme_picker_navigation.yaml -e QA_EMAIL=... -e QA_PASSWORD=...
- runFlow:
    file: ../subflows/login_qa.yaml
    env:
      LOGIN_EMAIL: ${QA_EMAIL}
      LOGIN_PASSWORD: ${QA_PASSWORD}
- runFlow:
    file: ../subflows/open_conversation.yaml
    env:
      CONTACT_NAME: claudeqa2
- runFlow:
    file: ../subflows/open_chat_menu_item.yaml
    env:
      MENU_ITEM_TEXT: "Tema del chat|Chat theme"
- assertVisible: "Predeterminado|Default"
- back
- assertVisible:
    id: "chat_input_field"
