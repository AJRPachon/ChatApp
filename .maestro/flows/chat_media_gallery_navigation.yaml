appId: com.ajrpachon.chatapp
---
# Signs in, opens the conversation with @claudeqa2, opens "Shared media"
# from the overflow menu, confirms the empty state renders (no crash/
# infinite spinner), then goes back to the same chat.
# Run with:
#   maestro test .maestro/flows/chat_media_gallery_navigation.yaml -e QA_EMAIL=... -e QA_PASSWORD=...
- runFlow:
    file: ../subflows/login_qa.yaml
    env:
      LOGIN_EMAIL: ${QA_EMAIL}
      LOGIN_PASSWORD: ${QA_PASSWORD}
- runFlow:
    file: ../subflows/open_conversation.yaml
    env:
      CONTACT_NAME: claudeqa2
- runFlow:
    file: ../subflows/open_chat_menu_item.yaml
    env:
      MENU_ITEM_TEXT: "Multimedia compartida|Shared media"
- extendedWaitUntil:
    visible: "No hay imágenes compartidas|No shared images"
    timeout: 10000
- back
- assertVisible:
    id: "chat_input_field"
