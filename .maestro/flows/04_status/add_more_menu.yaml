# With a live status, the "+" badge on My status offers text and image/video; text opens the
# compose dialog.
appId: com.ajrpachon.chatapp
name: "04 · Menú añadir más (texto y multimedia)"
tags:
  - status
---
- runFlow: ../../subflows/login.yaml
- runFlow:
    file: ../../subflows/status_publish_text.yaml
    env:
      STATUS_TEXT: "more${RUN_ID}"
- tapOn:
    id: status_add_more_button
- assertVisible:
    id: status_add_more_text
- assertVisible:
    id: status_add_more_media
- tapOn:
    id: status_add_more_text
- assertVisible:
    id: status_compose_text_field
- tapOn:
    id: status_compose_cancel
