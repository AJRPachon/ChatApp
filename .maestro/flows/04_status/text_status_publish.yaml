# Compose a text status and publish it; the viewer (which starts at the oldest live status)
# reaches it by tapping forward.
appId: com.ajrpachon.chatapp
name: "04 · Publicar estado de texto y verlo"
tags:
  - status
---
- runFlow: ../../subflows/ensure_logged_in.yaml
- runFlow:
    file: ../../subflows/status_publish_text.yaml
    env:
      STATUS_TEXT: "status${RUN_ID}"
- tapOn:
    id: status_my_avatar
- extendedWaitUntil:
    visible:
      id: status_viewer
    timeout: 5000
- repeat:
    while:
      notVisible:
        text: ".*status${RUN_ID}.*"
    times: 60
    commands:
      - tapOn:
          id: status_viewer_next_zone
      # The next story's text renders a moment after the tap: without this wait the loop
      # condition is checked too early and the flow taps past the status it is looking for.
      - extendedWaitUntil:
          visible:
            text: ".*status${RUN_ID}.*"
          timeout: 1500
          optional: true
- assertVisible:
    text: ".*status${RUN_ID}.*"
