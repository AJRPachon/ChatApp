appId: com.ajrpachon.chatapp
---
# Signs in, opens the profile screen, enables the "App lock" toggle,
# backgrounds the app for long enough to cross AppLockRepository's 30s
# threshold (MainActivity.APP_LOCK_TIMEOUT_MS) and resumes it WITHOUT
# killing the process (same pattern as background_resume_profile.yaml /
# subflows/background_and_resume.yaml), and confirms AppLockScreen
# renders on top instead of the profile screen simply reappearing.
# Leaves the toggle disabled again at the end (shared, persistent QA
# account — see .maestro/README.md "Higiene de datos").
#
# This project has no biometric/device-credential automation configured
# anywhere (confirmed: no maestro/emulator/biometric mention in
# .github/workflows/), and a bare emulator normally has neither a
# fingerprint nor a device PIN enrolled — so
# `BiometricManager.canAuthenticate(BIOMETRIC_STRONG or DEVICE_CREDENTIAL)`
# in AppLockScreen.kt's LaunchedEffect should return something other than
# BIOMETRIC_SUCCESS, and the real system BiometricPrompt should never
# auto-launch. This flow deliberately never taps
# "Unlock with fingerprint" / `applock_unlock_with_fingerprint` and never
# attempts to pass a real biometric/PIN challenge, per the task's explicit
# preference order.
#
# SECURITY FIX LANDED (fix/applock-back-button-bypass): `NavDisplay`'s
# `onBack` in MainActivity.kt now routes a back press away while
# `AppLockRoute` is on top to `moveTaskToBack(true)` instead of popping
# it off the stack — a plain back press/gesture can no longer bypass
# the lock screen. Confirmed directly on-device: this flow's original
# cleanup step (a plain `back` landing on ProfileScreen underneath) no
# longer works, by design — that was exactly the bug being closed.
#
# With no biometric/PIN enrolled on the emulator (this project has no
# such automation configured anywhere), there is now genuinely no
# UI-driven way back into the app once AppLockScreen triggers — which
# is correct app behavior, not a test limitation. So cleanup here uses
# `launchApp: { clearState: true }` (Maestro's `pm clear` equivalent)
# once the lock screen's presence is confirmed, wiping the app-lock
# flag (and everything else local) instead of trying to navigate back
# to toggle it off. Subsequent flows in the suite re-authenticate via
# their own `login_qa.yaml` regardless, so this doesn't strand the
# suite — only this flow ends the app logged out.
#
# Run with:
#   maestro test .maestro/flows/app_lock_toggle_roundtrip.yaml -e QA_EMAIL=... -e QA_PASSWORD=...
- runFlow:
    file: ../subflows/login_qa.yaml
    env:
      LOGIN_EMAIL: ${QA_EMAIL}
      LOGIN_PASSWORD: ${QA_PASSWORD}
- tapOn:
    id: "conversation_list_profile_button"
- extendedWaitUntil:
    visible:
      id: "profile_sign_out_button"
    timeout: 10000
- assertVisible:
    id: "profile_app_lock_switch"
- tapOn:
    id: "profile_app_lock_switch"
# Background long enough to cross the 30s APP_LOCK_TIMEOUT_MS threshold —
# a plain immediate background/resume (as in
# subflows/background_and_resume.yaml) would NOT trigger the lock at all.
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 32000
- launchApp:
    stopApp: false
    clearState: false
- extendedWaitUntil:
    visible:
      id: "applock_screen"
    timeout: 15000
- assertVisible:
    id: "applock_screen"
- assertNotVisible:
    id: "profile_sign_out_button"
# Deliberately does NOT tap "Unlock with fingerprint" — see notes above.
# No UI-driven way back past a real lock screen without a real
# biometric/PIN pass (that's the fix working as intended) — wipe local
# state instead of trying to navigate back to toggle it off.
- launchApp:
    clearState: true
