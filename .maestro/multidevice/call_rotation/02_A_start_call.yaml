# A starts a voice call to B and leaves it ringing (B accepts, then A rotates).
appId: com.ajrpachon.chatapp
tags:
  - multidevice
---
- runFlow: ../../subflows/open_chat_with_qa2.yaml
- tapOn:
    id: chat_call_button
- tapOn:
    id: chat_call_voice_option
- extendedWaitUntil:
    visible:
      id: call_screen
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "call_phase_(connecting|ringing)"
    timeout: 20000
