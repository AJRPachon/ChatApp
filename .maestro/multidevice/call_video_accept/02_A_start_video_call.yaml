# A starts a video call to B.
appId: com.ajrpachon.chatapp
tags:
  - multidevice
---
- runFlow: ../../subflows/open_chat_with_qa2.yaml
- tapOn:
    id: chat_call_button
- tapOn:
    id: chat_call_video_option
- extendedWaitUntil:
    visible:
      id: "call_phase_(connecting|ringing)"
    timeout: 20000
