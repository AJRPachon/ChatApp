# [D] A signs in with the same account and closes only B's session (the row without the
# "this device" badge), not "close all others".
appId: com.ajrpachon.chatapp
tags:
  - multidevice
  - known-bug
  - destructive
---
- runFlow:
    file: ../../subflows/login.yaml
    env:
      LOGIN_EMAIL: ${DISPOSABLE_EMAIL}
      LOGIN_PASSWORD: ${DISPOSABLE_PASSWORD}
- tapOn:
    id: conversation_list_profile_button
- scrollUntilVisible:
    element:
      id: profile_session_audit_row
    direction: DOWN
- tapOn:
    id: profile_session_audit_row
- extendedWaitUntil:
    visible:
      id: session_row_1
    timeout: 20000
- runFlow:
    when:
      visible:
        id: session_this_device_badge
        childOf:
          id: session_row_0
    commands:
      - tapOn:
          id: session_revoke_1
- runFlow:
    when:
      notVisible:
        id: session_this_device_badge
        childOf:
          id: session_row_0
    commands:
      - tapOn:
          id: session_revoke_0
- extendedWaitUntil:
    notVisible:
      id: session_row_1
    timeout: 20000
- assertVisible:
    id: session_this_device_badge
