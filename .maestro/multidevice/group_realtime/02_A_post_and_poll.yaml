# A writes in the group (mentioning B) and creates a poll.
appId: com.ajrpachon.chatapp
tags:
  - multidevice
---
- runFlow: ../../subflows/login.yaml
- runFlow:
    file: ../../subflows/open_conversation.yaml
    env:
      CONTACT: ${QA_GROUP}
- runFlow:
    file: ../../subflows/send_text.yaml
    env:
      TEXT: "grpmsg${RUN_ID}"
- runFlow:
    file: ../../subflows/open_attach.yaml
    env:
      ITEM: attach_poll
- tapOn:
    id: poll_question_field
- inputText: "gq${RUN_ID}"
- tapOn:
    id: poll_option_field_0
- inputText: "X${RUN_ID}"
- tapOn:
    id: poll_option_field_1
- inputText: "Y${RUN_ID}"
- hideKeyboard
- tapOn:
    id: poll_create_button
- extendedWaitUntil:
    visible:
      id: "poll_vote_X${RUN_ID}"
    timeout: 30000
