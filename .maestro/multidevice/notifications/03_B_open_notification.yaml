# B opens the notification shade, the notification from A (title = sender name; the body may be a
# generic text because messages are end-to-end encrypted) opens the chat with the new message.
appId: com.ajrpachon.chatapp
tags:
  - multidevice
---
- swipe:
    start: "50%,1%"
    end: "50%,70%"
    duration: 600
- extendedWaitUntil:
    visible:
      text: ${QA_NAME}
    timeout: 60000
- tapOn:
    text: ${QA_NAME}
- extendedWaitUntil:
    visible:
      id: chat_input_field
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "notif-${RUN_ID}"
    timeout: 30000
