# On a real phone the device's password manager offers to save the QA credentials into the
# owner's Google account right after sign-in. Dismiss it with Back: never "Save", and not
# "Never" either (that writes a "never for this app" preference into the owner's account).
appId: com.ajrpachon.chatapp
---
- extendedWaitUntil:
    visible:
      text: ".*(Gestor de contrase.as|Password Manager).*"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible:
        text: ".*(Gestor de contrase.as|Password Manager).*"
    commands:
      - back
