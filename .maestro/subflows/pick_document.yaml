# In the system document picker (DocumentsUI): open Downloads and pick FILE_NAME (pushed to
# /sdcard/Download by setup-emulators.ps1).
appId: com.ajrpachon.chatapp
---
- extendedWaitUntil:
    visible:
      text: ".*(Download|Descargas).*"
    timeout: 15000
- runFlow:
    when:
      notVisible:
        text: ${FILE_NAME}
    commands:
      - tapOn:
          text: ".*(Download|Descargas).*"
          index: 0
- extendedWaitUntil:
    visible:
      text: ${FILE_NAME}
    timeout: 15000
- tapOn:
    text: ${FILE_NAME}
