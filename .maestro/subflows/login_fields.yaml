# Clean launch, fill email/password and submit (no assertion on where it lands: sign-in result,
# username setup or MFA prompt). Params: LOGIN_EMAIL, LOGIN_PASSWORD.
appId: com.ajrpachon.chatapp
---
- runFlow: launch_clean.yaml
- extendedWaitUntil:
    visible:
      id: auth_email_field
    timeout: 15000
- tapOn:
    id: auth_email_field
- runFlow: dismiss_system_popups.yaml
- inputText: ${LOGIN_EMAIL}
- hideKeyboard
- tapOn:
    id: auth_password_field
- runFlow: dismiss_system_popups.yaml
- inputText: ${LOGIN_PASSWORD}
- hideKeyboard
- runFlow: dismiss_system_popups.yaml
- tapOn:
    id: auth_submit_button
- runFlow: decline_save_password.yaml
