# In the emulator camera app (com.android.camera2 / Google Camera): shutter, then confirm.
# System UI: selectors are the camera app's own resource ids / content descriptions.
appId: com.ajrpachon.chatapp
---
- extendedWaitUntil:
    visible:
      id: ".*(shutter_button|shutter).*"
    timeout: 20000
- tapOn:
    id: ".*(shutter_button|shutter).*"
- extendedWaitUntil:
    visible:
      id: ".*(done_button|btn_done|confirm).*"
    timeout: 20000
- tapOn:
    id: ".*(done_button|btn_done|confirm).*"
