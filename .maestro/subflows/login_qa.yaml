appId: com.ajrpachon.chatapp
---
# Reusable building block — NOT meant to run standalone.
# Signs in as the persistent QA account (@claudeqa) and waits for the
# chat list to appear. Call it from a flow with:
#   - runFlow: ../subflows/login_qa.yaml
# Requires QA_EMAIL / QA_PASSWORD env vars, e.g.:
#   maestro test .maestro/flows -e QA_EMAIL=... -e QA_PASSWORD=...
# Selectors use `id` (Compose testTag exposed via testTagsAsResourceId
# in MainActivity), not text — the sign-in tab and the submit button
# share the same literal label, and the label text itself is
# locale-dependent (values/ = es, values-en/ = en).
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "auth_email_field"
    timeout: 20000
- tapOn:
    id: "auth_email_field"
- inputText: ${QA_EMAIL}
- tapOn:
    id: "auth_password_field"
- inputText: ${QA_PASSWORD}
- hideKeyboard
- tapOn:
    id: "auth_submit_button"
- extendedWaitUntil:
    visible: "Chats"
    timeout: 15000
